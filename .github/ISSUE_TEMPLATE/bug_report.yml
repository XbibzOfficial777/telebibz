name: Bug report
description: Report a reproducible defect in telebibz.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include bot tokens, npm tokens, private keys, real user data, or private Telegram payloads. Use the security process for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: telebibz version
      placeholder: "0.1.3"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.13.0"
    validations:
      required: true
  - type: dropdown
    id: module-system
    attributes:
      label: Module system
      options:
        - ESM
        - CommonJS
        - Both
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect in one or two precise paragraphs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe code or repository that reproduces the issue. Replace all secrets with placeholders.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or stack trace
      description: Remove tokens, authorization headers, personal data, and private chat content.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I tested the latest relevant version.
          required: true
        - label: I removed secrets and private data.
          required: true
        - label: This is not a security vulnerability report.
          required: true
