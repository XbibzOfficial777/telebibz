name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --ignore-scripts --legacy-peer-deps
      - run: node scripts/generate-api.mjs
      - run: ./node_modules/.bin/tsc -p tsconfig.json --noEmit
      - run: ./node_modules/.bin/tsc -p tests/tsconfig.json --noEmit
      - run: ./node_modules/.bin/eslint scripts/*.mjs bin/*.mjs --no-error-on-unmatched-pattern
      - run: ./node_modules/.bin/vitest run
      - run: ./node_modules/.bin/tsc -p tsconfig.json
      - run: ./node_modules/.bin/tsc -p tsconfig.cjs.json
      - run: node scripts/create-cjs-package.mjs
      - run: npm pack --dry-run
      - run: npm audit --audit-level=high
