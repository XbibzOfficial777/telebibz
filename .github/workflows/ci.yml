name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Runtime tests (48 checks + local HTTP, no Telegram token)
        run: npm test
      - name: TypeScript declaration and payload tests
        run: npm run typecheck
      - name: Syntax check semua contoh
        run: |
          for f in examples/*.js; do node --check "$f"; done
      - run: npm pack --dry-run
      - run: npm audit --audit-level=high --omit=dev
