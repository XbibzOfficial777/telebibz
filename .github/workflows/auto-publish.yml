name: Auto publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-publish-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]')) }}
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate npm credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Missing NPM_TOKEN secret. Add it to the npm-release environment or repository Actions secrets."
            exit 1
          fi

      - name: Determine next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          latest=$(npm view @xbibzlibrary/telebibz version --registry=https://registry.npmjs.org 2>/dev/null || true)
          latest=${latest:-0.0.0}
          export CURRENT_VERSION="$current"
          export LATEST_VERSION="$latest"
          next=$(node <<'NODE'
          const parse = (value) => {
            const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(value);
            if (!match) throw new Error(`Expected stable x.y.z version, received: ${value}`);
            return match.slice(1).map(Number);
          };
          const current = parse(process.env.CURRENT_VERSION);
          const latest = parse(process.env.LATEST_VERSION);
          const base = current.reduce((cmp, part, i) => cmp || Math.sign(part - latest[i]), 0) >= 0 ? current : latest;
          base[2]++;
          process.stdout.write(base.join('.'));
          NODE
          )
          npm version "$next" --no-git-tag-version
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Publishing version $next (source: $current, npm latest: $latest)"

      - name: Runtime tests
        run: npm test

      - name: TypeScript declaration and payload tests
        run: npm run typecheck

      - name: Syntax check JavaScript
        run: |
          set -euo pipefail
          for f in index.js lib/*.js examples/*.js test/*.js; do node --check "$f"; done

      - name: Verify package and dependencies
        run: |
          npm pack --dry-run
          npm audit --audit-level=high --omit=dev

      - name: Verify release version is unused
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@xbibzlibrary/telebibz@$RELEASE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Version $RELEASE_VERSION already exists on npm; refusing to overwrite immutable release."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "Git tag v$RELEASE_VERSION already exists; refusing duplicate release."
            exit 1
          fi

      - name: Publish package
        run: npm publish --provenance=false --access public --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version and create tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$RELEASE_VERSION [skip release]"
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push origin HEAD:main
          git push origin "v$RELEASE_VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$RELEASE_VERSION" --generate-notes --title "telebibz v$RELEASE_VERSION"
